<script>


  window.addEventListener('DOMContentLoaded', () => {
    const role = localStorage.getItem('role'); // should be 'admin' or 'staff'
    const logo = document.getElementById('app-logo');
    if (role === 'admin') logo.textContent = 'Pompey Admin';
    else if (role === 'staff') logo.textContent = 'Pompey Staff';
    else logo.textContent = 'Pompey';
  });
  const userRole = localStorage.getItem('role'); // 'admin' or 'staff'

  async function loadStocks() {
    const res = await fetch('/api/stocks');
    const stocks = await res.json();
    const tbody = document.getElementById('stock-body');
    tbody.innerHTML = '';

    stocks.forEach(s => {
      const row = document.createElement('tr');
      row.setAttribute('data-id', s.stock_id);

      row.innerHTML = `
        <td>${s.stock_id}</td>
        <td>${escapeHtml(s.product_name)}</td>
        <td>${escapeHtml(s.showroom_name)}</td>
        <td>
          <span class="quantity-text">${s.quantity}</span>
          <input type="number" name="quantity" value="${s.quantity}" class="quantity-input" style="display:none; width: 60px;" />
        </td>
        <td>
          ${
            userRole === 'admin'
              ? `
                <button onclick="editStock(${s.stock_id})">Edit</button>
                <button onclick="deleteStock(${s.stock_id})">Delete</button>
                <button onclick="saveStock(${s.stock_id})" style="display:none;">Save</button>
                <button onclick="cancelEdit(${s.stock_id})" style="display:none;">Cancel</button>
              `
              : `<span style="color:gray;">Admin Only</span>`
          }
        </td>
      `;

      tbody.appendChild(row);
    });
  }

  function editStock(id) {
    const row = document.querySelector(`tr[data-id="${id}"]`);
    row.querySelector('.quantity-text').style.display = 'none';
    row.querySelector('input[name="quantity"]').style.display = 'inline-block';
    row.querySelector('button[onclick^="editStock"]').style.display = 'none';
    row.querySelector('button[onclick^="saveStock"]').style.display = 'inline-block';
    row.querySelector('button[onclick^="cancelEdit"]').style.display = 'inline-block';
  }

  async function saveStock(id) {
    const row = document.querySelector(`tr[data-id="${id}"]`);
    const quantity = row.querySelector('input[name="quantity"]').value;

    try {
      const res = await fetch(`/api/stocks/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ quantity })
      });
      const result = await res.json();
      if (result.status === 'success') {
        alert('Stock updated successfully!');
        loadStocks();
      } else {
        alert('Failed to update stock.');
      }
    } catch (err) {
      console.error('UPDATE STOCK ERROR:', err);
      alert('Server error.');
    }
  }

  function cancelEdit(id) {
    loadStocks();
  }

  async function deleteStock(id) {
    if (confirm('Are you sure you want to delete this stock entry?')) {
      const res = await fetch(`/api/stocks/${id}`, { method: 'DELETE' });
      const result = await res.json();
      if (result.status === 'success') {
        alert('Stock deleted successfully!');
        loadStocks();
      } else {
        alert('Failed to delete stock.');
      }
    }
  }

  window.onload = loadStocks;
</script>
  <script>requireRole("admin", "staff")</script>
