<body>

  <!-- Navigation Bar -->

    <nav class="navbar">
      <div class="logo">Pompey Admin</div>
            <div class="hamburger" onclick="toggleMenu()">
        <div></div>

      <ul class="nav-links" id="nav-links">
        <li><a id="dashboard-link" href="#">Dashboard</a></li>
        <li class="dropdown only-admin">
          <a href="#">Manage</a>
          <ul class="dropdown-menu">
            <!-- <li><a href="products.html">Products</a></li> -->

    </nav>
  </header>

<main>
    <!-- Add Customer Form -->
    <section class="form-section">
      <h1>Add New Customer</h1>
      <form id="add-customer-form">
        <label for="name">Full Name:</label>
        <input type="text" id="name" required>
  
        <label for="email">Email:</label>
        <input type="email" id="email" required>
  
        <label for="phone">Phone Number:</label>
        <input type="text" id="phone" required>
  
        <label for="address">Address:</label>
        <textarea id="address" rows="3" required></textarea>
  
        <button type="submit">Add Customer</button>
      </form>
    </section>
</main>

  <!-- Footer -->
  <footer>
    <div class="footer-links">
      <a href="about.html">About</a> |
      <a href="contact.html">Contact</a>
    </div>

    <div class="social-icons">
      <a href="#"><img src="images/facebook.png" alt="Facebook" /></a>
      <a href="#"><img src="images/instagram.png" alt="Instagram" /></a>
      <a href="#"><img src="images/twitter.png" alt="Twitter" /></a>
    </div>
  </footer>


  <script>
  const role = localStorage.getItem("role");
  const dashboardLink = document.getElementById("dashboard-link");

    if (role !== 'admin') {
    document.querySelectorAll('.only-admin').forEach(el => el.style.display = 'none');
  }


  if (role === "staff") {
    dashboardLink.href = "staff.html";
  } else if (role === "admin") {
    dashboardLink.href = "admin.html";
  } else {
    dashboardLink.href = "login.html"; // fallback if not logged in
  }
</script>

  <!-- Submit Handler Script -->
  <script>

    function toggleMenu() {
    const nav = document.getElementById('nav-links');
    nav.classList.toggle('active');
    }
    document.getElementById('add-customer-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const address = document.getElementById('address').value.trim();

      try {
        const res = await fetch('/api/customers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone_number: phone, address })
        });

        const data = await res.json();
        if (data.status === 'success') {
          alert('Customer added successfully!');
          this.reset();
        } else {
          alert('Failed to add customer.');
        }
      } catch (err) {
        console.error(err);
        alert('Server error while adding customer.');
      }
    });
  </script>
</body>
