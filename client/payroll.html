  <script>
  const role = localStorage.getItem("role");
  const dashboardLink = document.getElementById("dashboard-link");

    if (role !== 'admin') {
    document.querySelectorAll('.only-admin').forEach(el => el.style.display = 'none');
  }


  if (role === "staff") {
    dashboardLink.href = "staff.html";
  } else if (role === "admin") {
    dashboardLink.href = "admin.html";
  } else {
    dashboardLink.href = "login.html"; // fallback if not logged in
  }
</script>

  <!-- Script to Load Payroll -->
<script>

      function toggleMenu() {
    const nav = document.getElementById('nav-links');
    nav.classList.toggle('active');
    }
  async function loadPayroll() {
    try {
      const res = await fetch('/api/payroll');
      const payrolls = await res.json();
      const tbody = document.getElementById('payroll-body');
      tbody.innerHTML = '';

      payrolls.forEach(p => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${p.payroll_id}</td>
          <td>${p.name}</td>
          <td>${p.salary_type}</td>
          <td>£${parseFloat(p.amount).toFixed(2)}</td>

          <td>${p.payment_date ? new Date(p.payment_date).toLocaleDateString() : ''}</td>
          <td><button onclick="deletePayroll(${p.payroll_id})">Delete</button></td>
        `;
        tbody.appendChild(row);
      });

    } catch (err) {
      alert("Error loading payroll records.");
      console.error(err);
    }
  }

  async function deletePayroll(id) {
    if (confirm("Are you sure you want to delete this payroll record?")) {
      try {
        const res = await fetch(`/api/payroll/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.status === 'success') {
          alert("Deleted successfully.");
          loadPayroll();
        } else {
          alert("Failed to delete.");
        }
      } catch (err) {
        alert("Server error during deletion.");
      }
    }
  }

  window.onload = loadPayroll;
</script>
