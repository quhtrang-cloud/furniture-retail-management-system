  .hidden-input {
    display: none;
  }
  td input {
    padding: 5px;
    font-size: 14px;
    width: 100%;
  }
  td button {
    margin: 2px;
    padding: 5px 10px;
    font-size: 13px;
  }
</style>
</head>
<body>
  

<header>
  <nav class="navbar">
    <div class="logo" id="logo-text">Pompey Admin</div>
          <div class="hamburger" onclick="toggleMenu()">
        <div></div>
        <div></div>
        <div></div>
      </div>
    <ul class="nav-links" id="nav-links">
      <li><a id="dashboard-link" href="#">Dashboard</a></li>
      <li class="dropdown only-admin">
        <a href="#">Manage</a>
        <ul class="dropdown-menu">
          <!-- <li><a href="products.html">Products</a></li> -->
          <li><a href="customers.html" class="active">Customers</a></li>
          <li><a href="employees.html">Employees</a></li>
          <li><a href="stocks.html">Stocks</a></li>
          <li><a href="showrooms.html">Showrooms</a></li>
          <li><a href="payroll.html">Payroll</a></li>
        </ul>
      </li>
      <li><a href="login.html">Logout</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="data-section">
    <h1>All Customers</h1>
      <div class="table-responsive">
    <table class="data-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Address</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="customer-body"></tbody>
    </table>
  </div>
  </section>
</main>

<footer>
  <div class="footer-links">
    <a href="about.html">About</a> |
    <a href="contact.html">Contact</a>
  </div>
  <p>&copy; 2025 Pompey Furniture Company</p>
  <div class="social-icons">
    <a href="#"><img src="images/facebook.png" alt="Facebook" /></a>
    <a href="#"><img src="images/instagram.png" alt="Instagram" /></a>
    <a href="#"><img src="images/twitter.png" alt="Twitter" /></a>
  </div>
</footer>

<script>

    function toggleMenu() {
    const nav = document.getElementById('nav-links');
    nav.classList.toggle('active');
    }
  const role = localStorage.getItem("role");
  const dashboardLink = document.getElementById("dashboard-link");
  const logo = document.getElementById("logo-text");

    if (role !== 'admin') {
    document.querySelectorAll('.only-admin').forEach(el => el.style.display = 'none');
  }


  if (role === "staff") {
    dashboardLink.href = "staff.html";
    logo.innerText = "Pompey Staff";
  } else {
    dashboardLink.href = "admin.html";
  }

  async function loadCustomers() {
    try {
      const res = await fetch('/api/customers');
      const customers = await res.json();
      const tbody = document.getElementById('customer-body');
      tbody.innerHTML = '';

      customers.forEach(c => {
        const row = document.createElement('tr');
        row.setAttribute('data-id', c.customer_id);

        const readonly = role !== 'admin';

        row.innerHTML = `
          <td>${c.customer_id}</td>
          <td><span>${c.name}</span><input type="text" name="name" value="${c.name}" class="hidden-input" /></td>
          <td><span>${c.phone_number}</span><input type="text" name="phone" value="${c.phone_number}" class="hidden-input" /></td>
          <td><span>${c.email}</span><input type="email" name="email" value="${c.email}" class="hidden-input" /></td>
          <td><span>${c.address}</span><input name="address" value="${c.address}" class="hidden-input"/></td>
          <td>
            ${readonly ? '<span style="color: gray;">Admin only</span>' : `
              <button onclick="editRow(${c.customer_id})">Edit</button>
              <button onclick="saveCustomer(${c.customer_id})" class="hidden-input">Save</button>
              <button onclick="cancelEdit(${c.customer_id})" class="hidden-input">Cancel</button>
              <button onclick="deleteCustomer(${c.customer_id})">Delete</button>
            `}
          </td>
        `;
        tbody.appendChild(row);
      });
    } catch (err) {
      alert('Failed to load customers.');
      console.error(err);
    }
  }

  function editRow(id) {
    const row = document.querySelector(`tr[data-id="${id}"]`);
    row.querySelectorAll('span').forEach(el => el.style.display = 'none');
    row.querySelectorAll('input').forEach(el => el.style.display = 'inline');
    const buttons = row.querySelectorAll('button');
    buttons[0].style.display = 'none';   // Edit
    buttons[1].style.display = 'inline'; // Save
    buttons[2].style.display = 'inline'; // Cancel
  }

  function cancelEdit(id) {
    loadCustomers();
  }

  async function saveCustomer(id) {
    const row = document.querySelector(`tr[data-id="${id}"]`);
    const name = row.querySelector('input[name="name"]').value;
    const phone = row.querySelector('input[name="phone"]').value;
    const email = row.querySelector('input[name="email"]').value;
    const address = row.querySelector('input[name="address"]').value;

    try {
      const res = await fetch(`/api/customers/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone_number: phone, email, address })
      });

      const result = await res.json();
      if (result.status === 'success') {
        alert('Customer updated successfully!');
        loadCustomers();
      } else {
        alert('Update failed.');
      }
    } catch (err) {
      console.error('UPDATE ERROR:', err.stack);
      alert('Server error.');
    }
  }

  async function deleteCustomer(id) {
    if (confirm("Are you sure you want to delete this customer?")) {
      try {
        const res = await fetch(`/api/customers/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.status === 'success') {
          alert('Customer deleted successfully.');
          loadCustomers();
        } else {
          alert('Failed to delete customer.');
        }
      } catch (err) {
        alert('Server error while deleting customer.');
      }
    }
  }

  window.onload = loadCustomers;
</script>
</body>
</html>
