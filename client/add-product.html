  <link rel="canonical" href="https://yourdomain.com/">

</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <nav class="navbar">
      <div class="logo">Pompey Admin</div>
      <button type="button" class="hamburger" onclick="toggleMenu()" aria-label="Toggle navigation menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a id="dashboard-link" href="#">Dashboard</a></li>
        <li class="dropdown only-admin">
          <a href="#">Manage</a>
          <ul class="dropdown-menu">

            <li><a href="add-product.html" class="active">Add Product</a></li>
            <li><a href="customers.html">Customers</a></li>
            <li><a href="employees.html">Employees</a></li>
            <li><a href="stocks.html">Stocks</a></li>
            <li><a href="showrooms.html">Showrooms</a></li>

            <li><a href="payroll.html">Payroll</a></li>
          </ul>
        </li>
        <li><a href="login.html" onclick="event.preventDefault(); logout()">Logout</a></li>
      </ul>
    </nav>
  </header>

<main>
    <!-- Add Product Form -->
<section class="add-product-section">
  <h2>Add New Product</h2>
  <form class="add-product-form" id="add-product-form">
    <label for="name">Product name</label>
    <input id="name" type="text" name="name" required />
    <label for="category">Category</label>
    <select id="category" name="category_id" required>
      <option value="">Select a category</option>
    </select>
    <label for="description">Description</label>
    <textarea id="description" name="description" class="full-width" required></textarea>
    <label for="price">Price (£)</label>
    <input id="price" type="number" name="price" min="0.01" step="0.01" required />
    <label for="image1">Primary image filename</label>
    <input id="image1" type="text" name="image1" required />
    <label for="image2">Secondary image filename</label>
    <input id="image2" type="text" name="image2" required />
    
    <button type="submit">Add Product</button>
  </form>
</section>

</main>
  <!-- Footer -->
  <footer>
    <div class="footer-links">
      <a href="about.html">About</a> |
      <a href="contact.html">Contact</a>
    </div>
    <p>&copy; 2025 Pompey Furniture Company</p>
    <div class="social-icons">
      <a href="#"><img src="images/facebook.png" alt="Facebook" /></a>
      <a href="#"><img src="images/instagram.png" alt="Instagram" /></a>
      <a href="#"><img src="images/twitter.png" alt="Twitter" /></a>
    </div>
  </footer>


  <script>
  const role = localStorage.getItem("role");
  const dashboardLink = document.getElementById("dashboard-link");

    if (role !== 'admin') {
    document.querySelectorAll('.only-admin').forEach(el => el.style.display = 'none');
  }


  if (role === "staff") {
    dashboardLink.href = "staff.html";
  } else if (role === "admin") {
    dashboardLink.href = "admin.html";
  } else {
    dashboardLink.href = "login.html"; // fallback if not logged in
  }
</script>


  <!-- Script to Load Categories and Handle Submission -->
  <script>
    function toggleMenu() {
    const nav = document.getElementById('nav-links');
    nav.classList.toggle('active');
    }
    async function loadCategories() {
      const res = await fetch('/api/product-categories');
      const categories = await res.json();
      const select = document.getElementById('category');
      categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.category_id;
        opt.textContent = cat.name;
        select.appendChild(opt);
      });
    }

    document.getElementById('add-product-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const data = {
        name: document.getElementById('name').value.trim(),
        description: document.getElementById('description').value.trim(),
        price: parseFloat(document.getElementById('price').value),
        category_id: parseInt(document.getElementById('category').value),
        image1: document.getElementById('image1').value.trim(),
        image2: document.getElementById('image2').value.trim()
      };

      try {
        const res = await fetch('/api/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await res.json();
        if (result.status === 'success') {
          alert("Product added successfully.");
          this.reset();
        } else {
          alert("Failed to add product.");
        }
      } catch (err) {
        console.error(err);
        alert("Server error while adding product.");
      }
    });

    window.onload = loadCategories;
  </script>
  <script>requireRole("admin")</script>
</body>
</html>
