<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- SEO Meta Tags -->
  <meta name="description" content="Explore premium, locally crafted furniture for your home. Pompey Furniture offers luxury sofas, dining sets, wardrobes, and more with showroom pickup and a 28-day return guarantee.">
  <meta name="keywords" content="Pompey Furniture, premium furniture, luxury sofas, dining sets, wardrobes, home decor, showroom, Portsmouth, UK">
  <meta name="author" content="Pompey Furniture">
  <meta name="robots" content="index, follow">
  <!-- Open Graph / Facebook -->
  <meta property="og:title" content="Pompey Furniture | Elegant Living Starts Here">
  <meta property="og:description" content="Discover premium, locally crafted furniture for every room. Enjoy showroom pickup, loyalty discounts, and a 28-day return guarantee.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yourdomain.com/">
  <meta property="og:image" content="https://yourdomain.com/images/og-image.jpg">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pompey Furniture | Elegant Living Starts Here">
  <meta name="twitter:description" content="Explore premium, locally crafted furniture for your home. Showroom pickup and 28-day returns.">
  <meta name="twitter:image" content="https://yourdomain.com/images/twitter-card.jpg">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/products/favicon.png">
  <!-- Canonical URL -->
  <link rel="canonical" href="https://yourdomain.com/">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:700,400&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <nav class="navbar">
      <div class="logo">Pompey Furniture</div>
    
      <div class="hamburger" onclick="toggleMenu()">
        <div></div>
        <div></div>
        <div></div>
      </div>
    
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html" class="active">Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li class="dropdown">
          <a href="#">More</a>
          <ul class="dropdown-menu">
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
          </ul>
        </li>
      </ul>
    </nav>
    
  </header>

  <main>
  <section class="product-title">
    <h2>Our Furniture Collection</h2>
  </section>
  
 
  <section class="product-gallery" id="product-list">
   
  </section>

</main>

  <!-- Footer -->
  <footer>
    <div class="footer-links">
      <a href="about.html">About</a> |
      <a href="contact.html">Contact</a> |
      <a href="login.html">Login</a>
    </div>
    <p>&copy; 2025 Pompey Furniture Company</p>
    <div class="social-icons">
      <a href="#"><img src="images/facebook.png" alt="Facebook" /></a>
      <a href="#"><img src="images/instagram.png" alt="Instagram" /></a>
      <a href="#"><img src="images/twitter.png" alt="Twitter" /></a>
    </div>
  </footer>

  <!-- Product Fetching Script -->
  <script>
function toggleMenu() {
  document.getElementById('navLinks').classList.toggle('active');
}

async function loadProducts() {
  try {
    const res = await fetch("/api/products");
    const products = await res.json();
    const container = document.getElementById("product-list");
    container.innerHTML = "";

    if (!products || products.length === 0) {
      container.innerHTML = "<p>No products available.</p>";
      return;
    }

products.forEach(p => {
  const card = document.createElement('div');
  card.className = 'product-card';
  card.innerHTML = `
    <div class="product-image">
      <img src="images/products/${p.image1}" alt="${p.name}" />
    </div>
    <h3>${p.name}</h3>
    <p>£${p.price}</p>
    <p><strong>Showroom:</strong> ${p.showroom_name || 'Not assigned'}</p>
    <p><strong>Available:</strong> ${p.quantity ?? 0}</p>
    <div class="product-buttons">
  <button onclick="requireLogin()" class="primary">Add to Cart</button>
  <button onclick="requireLogin()" class="secondary">Details</button>
  <button onclick="requireLogin()" class="accent">Buy Now</button>
</div>

 
  `;
  container.appendChild(card);
});



  } catch (err) {
    console.error("Error loading products:", err);
  }
}

// Optional: Hide admin-only elements
window.onload = () => {
  loadProducts();
  const role = localStorage.getItem('role');
  if (role !== 'admin') {
    document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
  }
}


// Login requirement function
function requireLogin() {
  alert("Customer login needed to view the product.");
  window.location.href = "login.html"; // Change this to your actual login URL
}
</script>
</body>
</html>
