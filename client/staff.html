<main>

    <section class="dashboard">

</main>

  <!-- Script: Load Staff Data -->
<script>
  function toggleMenu() {
  document.getElementById('navLinks').classList.toggle('active');
}

  async function loadStaffStats() {
    const employeeId = localStorage.getItem('employee_id');
     fetch(`/api/staff/stock-count/${employeeId}`) // ✅ pull from login

    if (!employeeId) {
      alert("Employee ID not found. Please log in again.");
      window.location.href = 'login.html';
      return;
    }

    try {
      const [stockRes, orderRes, returnRes] = await Promise.all([
        fetch(`/api/staff/stock-count/${employeeId}`),
        fetch(`/api/staff/order-count/${employeeId}`),
        fetch(`/api/staff/return-count/${employeeId}`)
      ]);

      const stock = await stockRes.json();
      const orders = await orderRes.json();
      const returns = await returnRes.json();

      document.getElementById('stock-count').textContent = stock.total || 0;
      document.getElementById('order-count').textContent = orders.total || 0;
      document.getElementById('return-count').textContent = returns.total || 0;

    } catch (err) {
      alert("Error loading staff dashboard data.");
      console.error(err);
    }
  }

  window.onload = loadStaffStats;
</script>
</body>
