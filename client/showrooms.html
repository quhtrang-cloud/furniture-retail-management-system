<!-- Script for role-based setup -->
<script>
  const role = localStorage.getItem("role");
  const dashboardLink = document.getElementById("dashboard-link");
  const logo = document.getElementById("role-logo");

    if (role !== 'admin') {
    document.querySelectorAll('.only-admin').forEach(el => el.style.display = 'none');
  }


  if (role === "staff") {
    dashboardLink.href = "staff.html";
    logo.textContent = "Pompey Staff";
  } else if (role === "admin") {
    dashboardLink.href = "admin.html";
    logo.textContent = "Pompey Admin";
  } else {
    dashboardLink.href = "login.html";
    logo.textContent = "Pompey";
  }

  const isAdmin = role === "admin";
</script>

<!-- Script: Load Showrooms -->
<script>

      function toggleMenu() {
    const nav = document.getElementById('nav-links');
    nav.classList.toggle('active');
    }
  async function loadShowrooms() {
    try {
      const res = await fetch('/api/showrooms');
      const showrooms = await res.json();
      const tbody = document.getElementById('showroom-body');
      tbody.innerHTML = '';

      showrooms.forEach(s => {
        const row = document.createElement('tr');
        row.setAttribute('data-id', s.showroom_id);

let actions = '';
if (isAdmin) {
  actions = `
    <button onclick="editShowroom(${s.showroom_id})">Edit</button>
    <button onclick="deleteShowroom(${s.showroom_id})">Delete</button>
  `;
} else {
  actions = `<span style="color: gray; font-size: 0.9em;">Admin only</span>`;
}


        row.innerHTML = `
          <td>${s.showroom_id}</td>
          <td>${escapeHtml(s.name)}</td>
          <td>${escapeHtml(s.address)}</td>
          <td>${escapeHtml(s.contact_number)}</td>
          <td>${actions}</td>
        `;
        tbody.appendChild(row);
      });

    } catch (err) {
      alert("Failed to load showrooms.");
      console.error(err);
    }
  }

  function editShowroom(id) {
    if (!isAdmin) return;
    const row = document.querySelector(`tr[data-id="${id}"]`);
    const cells = row.children;
    const name = cells[1].innerText;
    const address = cells[2].innerText;
    const contact = cells[3].innerText;

    cells[1].innerHTML = `<input name="name" value="${name}" />`;
    cells[2].innerHTML = `<input name="address" value="${address}" />`;
    cells[3].innerHTML = `<input name="contact" value="${contact}" />`;

    cells[4].innerHTML = `
      <button onclick="saveShowroom(${id})">Save</button>
      <button onclick="cancelEdit(${id})">Cancel</button>
      
    `;
  }

  function cancelEdit(id) {
    loadShowrooms();
  }

  async function saveShowroom(id) {
    if (!isAdmin) return;
    const row = document.querySelector(`tr[data-id="${id}"]`);
    const name = row.querySelector('input[name="name"]').value;
    const address = row.querySelector('input[name="address"]').value;
    const contact = row.querySelector('input[name="contact"]').value;

    try {
      const res = await fetch(`/api/showrooms/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, address, contact_number: contact })
      });

      const result = await res.json();
      if (result.status === 'success') {
        alert("Showroom updated successfully.");
        loadShowrooms();
      } else {
        alert("Update failed.");
      }

    } catch (err) {
      alert("Server error during update.");
      console.error(err);
    }
  }

  async function deleteShowroom(id) {
    if (!isAdmin) return;
    if (confirm("Are you sure you want to delete this showroom?")) {
      try {
        const res = await fetch(`/api/showrooms/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.status === 'success') {
          alert("Showroom deleted.");
          loadShowrooms();
        } else {
          alert("Failed to delete showroom.");
        }
      } catch (err) {
        alert("Server error during deletion.");
      }
    }
  }

  window.onload = loadShowrooms;
</script>
