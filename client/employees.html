  <!-- Script: Load Employees -->
<script>

      function toggleMenu() {
    const nav = document.getElementById('nav-links');
    nav.classList.toggle('active');
    }
  const isAdmin = localStorage.getItem('role') === 'admin';

  async function loadEmployees() {
    try {
      const res = await fetch('/api/employees');
      let employees = await res.json();

      // ✅ Sort by employee_id to maintain order
      employees.sort((a, b) => a.employee_id - b.employee_id);

      const tbody = document.getElementById('employee-body');
      tbody.innerHTML = '';

      employees.forEach(e => {
        const row = document.createElement('tr');
        row.setAttribute('data-id', e.employee_id);
        row.innerHTML = `
          <td>${e.employee_id}</td>
          <td>${escapeHtml(e.name)}</td>
          <td>${escapeHtml(e.role)}</td>
          <td>${escapeHtml(e.employment_type || 'Not specified')}</td>
          <td>${escapeHtml(e.showroom_name)}</td>
          <td>
            ${isAdmin ? `
              <button onclick="editEmployee(${e.employee_id})">Edit</button>
              <button onclick="deleteEmployee(${e.employee_id})">Delete</button>
            ` : `<span>View Only</span>`}
          </td>
        `;
        tbody.appendChild(row);
      });
    } catch (err) {
      console.error("Failed to load employees:", err);
      alert("Server error loading employees.");
    }
  }

  function editEmployee(id) {
    const row = document.querySelector(`tr[data-id="${id}"]`);
    const [nameCell, roleCell, typeCell, showroomCell] = row.querySelectorAll('td:nth-child(n+2):nth-child(-n+5)');
    const currentName = nameCell.textContent.trim();
    const currentRole = roleCell.textContent.trim();
    const currentType = typeCell.textContent.trim();
    const currentShowroom = showroomCell.textContent.trim();

    nameCell.innerHTML = `<input name="name" value="${currentName}">`;
    roleCell.innerHTML = `<input name="role" value="${currentRole}">`;
    typeCell.textContent = currentType;
    showroomCell.innerHTML = `<input name="showroom" value="${currentShowroom}">`;

    const actionCell = row.querySelector('td:last-child');
    actionCell.innerHTML = `
      <button onclick="saveEmployee(${id})">Save</button>
      <button onclick="loadEmployees()">Cancel</button>
    `;
  }

  async function saveEmployee(id) {
    const row = document.querySelector(`tr[data-id="${id}"]`);
    const name = row.querySelector('input[name="name"]').value.trim();
    const role = row.querySelector('input[name="role"]').value.trim();
    const showroom = row.querySelector('input[name="showroom"]').value.trim();

    try {
      const res = await fetch(`/api/employees/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, role, showroom })
      });

      const result = await res.json();
      if (result.status === 'success') {
        alert('Employee updated successfully!');
        loadEmployees(); // refresh to maintain sorted order
      } else {
        alert('Update failed.');
      }
    } catch (err) {
      console.error('UPDATE EMPLOYEE ERROR:', err);
      alert('Server error');
    }
  }

  async function deleteEmployee(id) {
    if (confirm('Are you sure you want to delete this employee?')) {
      try {
        const res = await fetch(`/api/employees/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.status === 'success') {
          loadEmployees();
        } else {
          alert("Failed to delete employee.");
        }
      } catch (err) {
        alert('Error deleting employee');
      }
    }
  }

  window.onload = loadEmployees;
</script>
